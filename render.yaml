services:
  - type: web
    name: securepay-3fa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENCRYPTION_KEY
        generateValue: false
        sync: false
      - key: DEMO_MODE
        value: "true"
